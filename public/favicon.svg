<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="iatsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8232A" />
      <stop offset="50%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="iatsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.3" flood-color="#000" />
    </filter>
  </defs>

  <!-- Squircle Base with IATS Deep Red to Royal Blue Theme -->
  <rect width="64" height="64" rx="16" fill="url(#iatsGrad)" />
  
  <!-- Subtle Frosted Glass Border Overlay -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- IATS Academy & Technology Synergy Icon -->
  <g filter="url(#iatsShadow)">
    <!-- Circuit Lines / Tech Synergy -->
    <path d="M16 33 L24 33 L29 22 L35 42 L40 33 L48 33" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Academic Torch Flame / Innovation Star -->
    <circle cx="32" cy="18" r="4" fill="url(#goldGrad)" />
    <path d="M32 12 L33.5 16.5 L38 18 L33.5 19.5 L32 24 L30.5 19.5 L26 18 L30.5 16.5 Z" fill="url(#goldGrad)" />

    <!-- Connection Orbit Nodes -->
    <circle cx="16" cy="33" r="3" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="48" cy="33" r="3" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- "IATS" Monogram Text at Base -->
    <text x="32" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10.5" fill="#FFFFFF" letter-spacing="1.5">IATS</text>
  </g>
</svg>
